name: Build APKs
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -q FamilyShield-phase1.zip
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle :parent:assembleDebug :child:assembleDebug --stacktrace
        working-directory: FamilyShield
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyShield-apks
          path: FamilyShield/*/build/outputs/apk/debug/*.apk
